# Banco local de desenvolvimento:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin_dev_pw
      POSTGRES_DB: fin_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d fin_dev"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
