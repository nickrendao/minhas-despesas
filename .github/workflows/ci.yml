name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fin, POSTGRES_PASSWORD: fin_dev_pw, POSTGRES_DB: fin_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fin" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @fin/shared
      - run: npm run build -w @fin/api-client
      - run: npm run prisma:generate -w @fin/api
      - run: npx tsc -p apps/api/tsconfig.json --noEmit
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://fin:fin_dev_pw@localhost:5432/fin_test
      # Detecta divergência entre schema.prisma e as migrations SQL (algo que eu NÃO consegui rodar no meu ambiente)
      - name: Verificar sincronia schema.prisma x migrations
        working-directory: apps/api
        env: { DATABASE_URL: "postgresql://fin:fin_dev_pw@localhost:5432/fin_test" }
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
